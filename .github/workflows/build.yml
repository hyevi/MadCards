name: Build MadCards APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and Find Project Root
        run: |
          mkdir -p src
          unzip -o .github/source.zip -d src
          
          # Ищем папку, где лежит settings.gradle.kts
          PROJECT_DIR=$(find src -maxdepth 3 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ ОШИБКА: В архиве не найден settings.gradle(.kts)!"
            ls -laR src
            exit 1
          fi
          
          echo "✅ Проект найден в папке: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: AUTO-FIX Project Files (AGP & Properties)
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          # 1. Обновляем AGP до 8.7.0 (полная поддержка SDK 35)
          sed -i 's/id("com.android.application") version "8.5.2"/id("com.android.application") version "8.7.0"/' build.gradle.kts
          sed -i 's/com.android.application" version "8.5.2"/com.android.application" version "8.7.0"/' build.gradle.kts
          
          # 2. Добавляем флаг подавления предупреждений, если его нет
          if ! grep -q "suppressUnsupportedCompileSdk" gradle.properties; then
            echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          fi
          
          echo "=== Проверка версии AGP ==="
          grep "com.android.application" build.gradle.kts || true
          
          echo "=== Проверка gradle.properties ==="
          cat gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Явно устанавливаем платформу 35 и build-tools
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Gradle 8.9 идеально работает с AGP 8.7.0
          gradle-version: '8.9'

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew || true

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadCards-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
