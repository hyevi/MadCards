name: Build MadCards APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and Find Project Root
        run: |
          mkdir -p src
          unzip -o .github/source.zip -d src
          
          # Ищем папку, в которой лежит settings.gradle или settings.gradle.kts
          PROJECT_DIR=$(find src -maxdepth 3 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ ОШИБКА: В архиве не найден settings.gradle(.kts)!"
            echo "=== Содержимое папки src ==="
            ls -laR src
            exit 1
          fi
          
          echo "✅ Проект найден в папке: $PROJECT_DIR"
          # Сохраняем путь, чтобы использовать в следующих шагах
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew || true

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadCards-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
