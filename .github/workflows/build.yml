name: Build MadCards APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and Find Project Root
        run: |
          mkdir -p src
          unzip -o .github/source.zip -d src
          
          PROJECT_DIR=$(find src -maxdepth 3 -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ ОШИБКА: В архиве не найден settings.gradle(.kts)!"
            exit 1
          fi
          
          echo "✅ Проект найден в папке: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: AUTO-FIX Project Files (AGP, Properties & Icons)
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          # 1. Исправляем версию AGP для поддержки SDK 35
          sed -i 's/id("com.android.application") version "8.5.2"/id("com.android.application") version "8.7.0"/' build.gradle.kts || true
          sed -i 's/com.android.application" version "8.5.2"/com.android.application" version "8.7.0"/' build.gradle.kts || true
          
          # 2. Добавляем флаг подавления предупреждений
          if ! grep -q "suppressUnsupportedCompileSdk" gradle.properties; then
            echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          fi
          
          # 3. АВТОМАТИЧЕСКАЯ ПОЧИНКА ИКОНКИ
          mkdir -p app/src/main/res/drawable-nodpi
          
          # Ищем любую картинку иконки в проекте
          ICON_PATH=$(find . -maxdepth 3 -type f \( -iname "madcards_icon.*" -o -iname "app-preview.*" -o -iname "madcards_logo.*" \) | head -n 1)
          
          if [ -n "$ICON_PATH" ]; then
            echo "✅ Найдена картинка: $ICON_PATH. Копирую в drawable..."
            cp "$ICON_PATH" app/src/main/res/drawable-nodpi/madcards_icon.png
          else
            echo "⚠️ Картинка не найдена в архиве! Создаю прозрачную заглушку, чтобы сборка не упала."
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > app/src/main/res/drawable-nodpi/madcards_icon.png
          fi
          
          # Перезаписываем ic_launcher_foreground.xml на всякий случай
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/madcards_icon"
              android:inset="10%" />
          EOF
          
          echo "=== Подготовка завершена ==="

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Grant execute permission for gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew || true

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadCards-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
